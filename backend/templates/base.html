<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Personal AI Homelab Platform{% endblock %}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --card: #f8fafc;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --border: rgba(148, 163, 184, 0.2);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 40%, #0f172a);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .container {
        width: min(1100px, calc(100% - 2rem));
        margin: 0 auto;
      }
      .topbar {
        position: sticky;
        top: 0;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 68px;
      }
      .brand {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .nav-links {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .nav-links a {
        color: var(--muted);
        transition: color 0.2s ease;
      }
      .nav-links a:hover {
        color: var(--text);
      }
      .food-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin: 0 0 1.5rem;
        padding: 0.45rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.7);
      }
      .food-nav a {
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        color: var(--muted);
      }
      .food-nav a:hover,
      .food-nav a:focus-visible {
        background: rgba(56, 189, 248, 0.14);
        color: var(--text);
      }
      .content {
        padding: 2rem 0 4rem;
      }
      .hero {
        padding: 2rem 0 1rem;
      }
      .hero h1 {
        margin-bottom: 0.75rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        max-width: 700px;
        line-height: 1.6;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.2rem;
        margin-top: 2rem;
      }
      .card {
        background: rgba(248, 250, 252, 0.95);
        color: #0f172a;
        border-radius: 16px;
        padding: 1.25rem;
        border: 1px solid rgba(15, 23, 42, 0.06);
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12);
      }
      .card h3 {
        margin: 0 0 0.75rem;
        font-size: 1.1rem;
      }
      .card p {
        margin: 0 0 1rem;
        color: #334155;
        line-height: 1.5;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 0.38rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        background: rgba(56, 189, 248, 0.12);
        color: #0369a1;
      }
      .pill.ghost {
        background: rgba(148, 163, 184, 0.2);
        color: #475569;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.8rem;
      }
      .button {
        display: inline-block;
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        border-radius: 10px;
        padding: 0.7rem 1rem;
      }
      .button.secondary {
        background: transparent;
        color: #334155;
        border: 1px solid rgba(148, 163, 184, 0.5);
      }
      button.button {
        border: 0;
        cursor: pointer;
      }
      .warning-button {
        background: #fbbf24;
        color: #422006;
      }
      .danger-link {
        color: #fca5a5;
      }
      .link-button {
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        font: inherit;
        text-decoration: underline;
      }
      .video-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
      .video-project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
      .video-panel, .video-empty { background: rgba(17, 24, 39, .82); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; min-width: 0; }
      .video-empty { margin-top: 1.5rem; text-align: center; padding: 3rem 1.5rem; }
      .video-panel h2, .video-empty h2 { margin: 0 0 .65rem; font-size: 1.15rem; }
      .video-panel h3 { font-size: .95rem; margin: 1rem 0 .5rem; }
      .video-panel p, .video-empty p { color: var(--muted); line-height: 1.5; }
      .video-panel-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
      .video-panel-heading h2 { margin: 0 0 .35rem; }
      .video-panel-heading p { margin: 0; }
      .video-status { color: #bae6fd; background: rgba(56,189,248,.12); padding: .35rem .6rem; border-radius: 999px; font-size: .75rem; white-space: nowrap; }
      .video-stats { display: flex; flex-wrap: wrap; gap: .6rem 1rem; margin: .9rem 0; color: var(--muted); font-size: .82rem; }
      .video-form-panel { max-width: 720px; }
      .video-form-field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; margin-bottom: .9rem; flex: 1; }
      .video-form-field label { color: var(--text); font-weight: 600; font-size: .88rem; }
      .video-form-field input, .video-form-field select, .video-form-field textarea { width: 100%; padding: .7rem .75rem; border-radius: 8px; border: 1px solid rgba(148,163,184,.35); background: #0b1220; color: var(--text); font: inherit; }
      .video-form-field small, .video-muted, .video-panel small { color: var(--muted); font-size: .8rem; line-height: 1.5; }
      .video-form-row, .video-clip-form { display: flex; align-items: end; gap: .75rem; flex-wrap: wrap; }
      .video-form-row .video-form-field { min-width: 180px; }
      .video-form-row .button, .video-clip-form .button { margin-bottom: .9rem; }
      .video-path { display: inline-block; padding: .65rem .8rem; border-radius: 8px; background: #020817; color: #bae6fd; overflow-wrap: anywhere; }
      .video-notice { background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.3); color: #fde68a; padding: .8rem; border-radius: 9px; font-size: .88rem; }
      .video-inbox-list { margin-top: 1rem; padding-top: .8rem; border-top: 1px solid var(--border); }
      .video-inbox-list > div { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; color: var(--text); font-size: .85rem; }
      .video-asset-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 1rem; }
      .video-section-gap { margin-top: 1rem; }
      .video-clip-list, .video-job-list { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
      .video-clip-row, .video-job-row { display: flex; align-items: center; gap: .8rem; padding: .8rem; border: 1px solid var(--border); border-radius: 10px; background: rgba(2,8,23,.45); }
      .video-clip-row.is-excluded { opacity: .5; }
      .video-clip-number { display: grid; place-items: center; flex: 0 0 30px; height: 30px; border-radius: 8px; background: rgba(56,189,248,.14); color: #bae6fd; font-weight: 700; }
      .video-clip-info, .video-job-row > div:first-child { display: flex; flex-direction: column; gap: .2rem; min-width: 0; flex: 1; }
      .video-clip-info span, .video-job-row span { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
      .video-clip-info small { color: var(--muted); }
      .video-clip-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
      .button.danger { background: rgba(248,113,113,.15); color: #fecaca; border: 1px solid rgba(248,113,113,.35); }
      .video-total { display: flex; justify-content: space-between; padding-top: 1rem; margin-top: .8rem; border-top: 1px solid var(--border); }
      .video-progress { width: 100px; height: 7px; border-radius: 99px; overflow: hidden; background: rgba(148,163,184,.2); }
      .video-progress span { display: block; height: 100%; background: var(--accent-2); }
      .video-error { color: #fca5a5 !important; }
      @media (max-width: 760px) { .video-layout, .video-asset-groups { grid-template-columns: 1fr; } .video-clip-row { align-items: flex-start; flex-wrap: wrap; } .video-clip-actions { width: 100%; padding-left: 38px; } .video-panel-heading { flex-direction: column; } }
      .page-shell {
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 2rem;
      }
      .page-shell h2 {
        margin-top: 0;
      }
      .muted {
        color: var(--muted);
      }
      .messages {
        display: grid;
        gap: 0.6rem;
        margin-bottom: 1rem;
      }
      .message {
        border: 1px solid rgba(34, 197, 94, 0.35);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }
      form p {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin: 0;
      }
      form label {
        font-weight: 700;
      }
      form input,
      form select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0.65rem 0.75rem;
        font: inherit;
      }
      .helptext {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .errorlist {
        margin: 0;
        padding-left: 1rem;
        color: #fecaca;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      .data-table th,
      .data-table td {
        padding: 0.7rem 0.5rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      .data-table th {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .empty-state {
        color: var(--muted);
        padding: 1rem 0;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.8rem;
        margin: 1.25rem 0 2rem;
      }
      .summary-card {
        display: grid;
        gap: 0.35rem;
        padding: 1rem;
        border-radius: 12px;
        background: rgba(248, 250, 252, 0.95);
        color: #0f172a;
      }
      .summary-card span {
        color: #475569;
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .summary-card strong {
        font-size: 1.15rem;
      }
      .warning {
        border: 1px solid rgba(251, 191, 36, 0.45);
        border-radius: 10px;
        padding: 0.8rem 1rem;
        background: rgba(251, 191, 36, 0.12);
        color: #fef3c7;
      }
      .date-picker {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 0.75rem;
      }
      .date-picker label {
        display: grid;
        gap: 0.35rem;
        font-weight: 700;
      }
      .date-picker input {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0.65rem 0.75rem;
        font: inherit;
      }
      .confirmation-field {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .confirmation-field label {
        font-weight: 700;
      }
      .compact-actions {
        align-items: center;
        margin-top: 0;
      }
      .compact-actions form {
        display: inline;
      }
      .info-box {
        border-left: 3px solid var(--accent);
        padding: 0.75rem 1rem;
        background: rgba(56, 189, 248, 0.08);
        color: #cbd5e1;
        line-height: 1.5;
      }
      .info-box strong {
        color: var(--text);
      }
      @media (max-width: 640px) {
        .nav {
          flex-direction: column;
          justify-content: center;
          gap: 0.75rem;
          padding: 1rem 0;
        }
        .page-shell {
          padding: 1.25rem;
        }
        .data-table {
          display: block;
          overflow-x: auto;
        }
        .date-picker {
          align-items: stretch;
          flex-direction: column;
        }
        .food-nav {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .food-nav a {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a href="/" class="brand">Personal AI Homelab Platform</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="{% url 'food_today' %}">Food</a>
          <a href="{% url 'video_project_list' %}">Video Editor</a>
          <a href="{% url 'assistant_chat' %}">AI Assistant</a>
        </nav>
      </div>
    </header>

    <main class="container content">
      {% if messages %}
        <div class="messages" aria-live="polite">
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
