<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Personal AI Homelab Platform{% endblock %}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --card: #f8fafc;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --border: rgba(148, 163, 184, 0.2);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 40%, #0f172a);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .container {
        width: min(1100px, calc(100% - 2rem));
        margin: 0 auto;
      }
      .topbar {
        position: sticky;
        top: 0;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 68px;
      }
      .brand {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .nav-links {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .nav-links a {
        color: var(--muted);
        transition: color 0.2s ease;
      }
      .nav-links a:hover {
        color: var(--text);
      }
      .content {
        padding: 2rem 0 4rem;
      }
      .hero {
        padding: 2rem 0 1rem;
      }
      .hero h1 {
        margin-bottom: 0.75rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        max-width: 700px;
        line-height: 1.6;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.2rem;
        margin-top: 2rem;
      }
      .card {
        background: rgba(248, 250, 252, 0.95);
        color: #0f172a;
        border-radius: 16px;
        padding: 1.25rem;
        border: 1px solid rgba(15, 23, 42, 0.06);
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12);
      }
      .card h3 {
        margin: 0 0 0.75rem;
        font-size: 1.1rem;
      }
      .card p {
        margin: 0 0 1rem;
        color: #334155;
        line-height: 1.5;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 0.38rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        background: rgba(56, 189, 248, 0.12);
        color: #0369a1;
      }
      .pill.ghost {
        background: rgba(148, 163, 184, 0.2);
        color: #475569;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.8rem;
      }
      .button {
        display: inline-block;
        background: var(--accent);
        color: #082f49;
        font-weight: 700;
        border-radius: 10px;
        padding: 0.7rem 1rem;
      }
      .button.secondary {
        background: transparent;
        color: #334155;
        border: 1px solid rgba(148, 163, 184, 0.5);
      }
      .page-shell {
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 2rem;
      }
      .page-shell h2 {
        margin-top: 0;
      }
      .muted {
        color: var(--muted);
      }
      .messages {
        display: grid;
        gap: 0.6rem;
        margin-bottom: 1rem;
      }
      .message {
        border: 1px solid rgba(34, 197, 94, 0.35);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }
      form p {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin: 0;
      }
      form label {
        font-weight: 700;
      }
      form input,
      form select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0.65rem 0.75rem;
        font: inherit;
      }
      .helptext {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .errorlist {
        margin: 0;
        padding-left: 1rem;
        color: #fecaca;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      .data-table th,
      .data-table td {
        padding: 0.7rem 0.5rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      .data-table th {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .empty-state {
        color: var(--muted);
        padding: 1rem 0;
      }
      @media (max-width: 640px) {
        .nav {
          flex-direction: column;
          justify-content: center;
          gap: 0.75rem;
          padding: 1rem 0;
        }
        .page-shell {
          padding: 1.25rem;
        }
        .data-table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a href="/" class="brand">Personal AI Homelab Platform</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/food/">Food</a>
        </nav>
      </div>
    </header>

    <main class="container content">
      {% if messages %}
        <div class="messages" aria-live="polite">
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
